<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Jig v1.0.3 desktop Planner structural reference">
<style>
text{font-family:Inter,Arial,sans-serif;fill:#152238}.h1{font-size:25px;font-weight:700}.h2{font-size:18px;font-weight:700}.b{font-size:13px;font-weight:600}.s{font-size:11px;font-weight:500}.muted{fill:#657187}.accent{fill:#4f39c8}.line{stroke:#dce3ec;stroke-width:1}
</style>
<rect width="1440" height="900" fill="#f7f8fb"/>
<rect x="0" y="0" width="1440" height="94" fill="#fff" class="line"/>
