</g>
<!-- right workspace -->
<rect x="1034" y="94" width="406" height="806" fill="#fff" stroke="#dce3ec"/>
<text x="1064" y="150" class="h1">Finalize agreement</text><text x="1400" y="128" text-anchor="end" class="h2">×</text>
<line x1="1060" y1="186" x2="1414" y2="186" stroke="#e5e9ef"/>
<text x="1064" y="226" class="b">Scheduled</text><text x="1252" y="226" class="b">Thu, 19 Nov 2026</text>
<text x="1064" y="274" class="b">Priority</text><rect x="1250" y="250" width="148" height="36" rx="8" fill="#fff" class="line"/><circle cx="1268" cy="268" r="5" fill="#e24b3b"/><text x="1282" y="273" class="b">High</text>
<text x="1064" y="322" class="b">Reminder</text><text x="1252" y="322" class="b muted">—</text>
<text x="1064" y="370" class="b">Reference</text><text x="1252" y="370" class="b muted">—</text>
<line x1="1060" y1="402" x2="1414" y2="402" stroke="#e5e9ef"/>
<text x="1064" y="445" class="b">Notes</text><rect x="1060" y="462" width="354" height="98" rx="9" fill="#fafbfc" class="line"/><text x="1078" y="492" class="b">Complete final review and prepare</text><text x="1078" y="513" class="b">the agreement for signature.</text>
<rect x="1060" y="818" width="82" height="42" rx="9" fill="#fff" class="line"/><text x="1101" y="844" text-anchor="middle" class="b">✎  Edit</text>
