<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Jig Day canonical reference">
<style>text{font-family:Inter,Arial,Helvetica,sans-serif}.t{fill:#152238}.m{fill:#657187}.muted{fill:#8a96a8}.h1{font-size:26px;font-weight:700}.h2{font-size:18px;font-weight:700}.b{font-size:13px;font-weight:600}.s{font-size:11px;font-weight:500}.xs{font-size:10px;font-weight:500}</style>
<rect x="0" y="0" width="1440" height="900" rx="0" fill="#f6f8fb" stroke="none" stroke-width="1"/>
<rect x="20" y="20" width="190" height="860" rx="12" fill="#ffffff" stroke="#dce3ec" stroke-width="1"/>
<text x="42" y="58" class="h1">Jig</text>
<text x="42" y="80" class="s">Schedules attention</text>
<line x1="30" y1="98" x2="200" y2="98" stroke="#dfe5ee" stroke-width="1"/>
<text x="48" y="120" class="b" fill="#41516a" font-weight="500">Week</text>
<rect x="30" y="143" width="170" height="40" rx="7" fill="#edf3ff" stroke="none" stroke-width="1"/>
<text x="48" y="170" class="b" fill="#244b91" font-weight="700">Day</text>
<text x="48" y="220" class="b" fill="#41516a" font-weight="500">History</text>
<text x="48" y="270" class="b" fill="#41516a" font-weight="500">Settings</text>
<line x1="30" y1="320" x2="200" y2="320" stroke="#dfe5ee" stroke-width="1"/>
<text x="42" y="350" class="s" fill="#7b8799">Planning data</text>
<text x="42" y="370" class="xs" fill="#9aa5b5">Personal Git repository</text>
<text x="240" y="58" class="h1">Save and synchronization states</text>
<text x="240" y="82" class="s">Local persistence and remote synchronization are intentionally distinct</text>
<rect x="1230" y="34" width="180" height="40" rx="20" fill="#edf7f3" stroke="#dce3ec" stroke-width="1"/>
<circle cx="1250" cy="54" r="5" fill="#2c765f" stroke="none" stroke-width="1"/>
<text x="1265" y="59" class="s" fill="#2c765f" font-weight="700">Synced</text>
<rect x="240" y="150" width="1170" height="92" rx="9" fill="#ffffff" stroke="#dce3ec" stroke-width="1"/>
<rect x="260" y="170" width="230" height="32" rx="16" fill="#edf7f3" stroke="none" stroke-width="1"/>
<circle cx="278" cy="186" r="5" fill="#2c765f" stroke="none" stroke-width="1"/>
<text x="292" y="191" class="s" fill="#2c765f" font-weight="700">Saved locally / Synced</text>
<text x="520" y="189" class="s" fill="#152238">Local edit committed; portable data reached configured remote.</text>
<text x="520" y="211" class="xs" fill="#657187">The planner remains truthful about what is safe locally and what has reached Git remote.</text>
<rect x="240" y="256" width="1170" height="92" rx="9" fill="#ffffff" stroke="#dce3ec" stroke-width="1"/>
<rect x="260" y="276" width="230" height="32" rx="16" fill="#fff6dd" stroke="none" stroke-width="1"/>
<circle cx="278" cy="292" r="5" fill="#9a6b12" stroke="none" stroke-width="1"/>
<text x="292" y="297" class="s" fill="#9a6b12" font-weight="700">Sync pending / Retrying</text>
<text x="520" y="295" class="s" fill="#152238">Local edit is safe; export or remote transfer is still outstanding.</text>
<text x="520" y="317" class="xs" fill="#657187">The planner remains truthful about what is safe locally and what has reached Git remote.</text>
<rect x="240" y="362" width="1170" height="92" rx="9" fill="#ffffff" stroke="#dce3ec" stroke-width="1"/>
<rect x="260" y="382" width="230" height="32" rx="16" fill="#f2f4f7" stroke="none" stroke-width="1"/>
<circle cx="278" cy="398" r="5" fill="#5f6f84" stroke="none" stroke-width="1"/>
<text x="292" y="403" class="s" fill="#5f6f84" font-weight="700">Local only</text>
<text x="520" y="401" class="s" fill="#152238">No remote is configured. Local DB and local Jig Git commits continue normally.</text>
<text x="520" y="423" class="xs" fill="#657187">The planner remains truthful about what is safe locally and what has reached Git remote.</text>
<rect x="240" y="468" width="1170" height="92" rx="9" fill="#ffffff" stroke="#dce3ec" stroke-width="1"/>
<rect x="260" y="488" width="230" height="32" rx="16" fill="#fff0ef" stroke="none" stroke-width="1"/>
<circle cx="278" cy="504" r="5" fill="#a33a34" stroke="none" stroke-width="1"/>
<text x="292" y="509" class="s" fill="#a33a34" font-weight="700">Sync issue</text>
<text x="520" y="507" class="s" fill="#152238">Repository synchronization cannot complete; local planning data remains safe.</text>
<text x="520" y="529" class="xs" fill="#657187">Jig does not classify or repair Git history; resolve repository state with Git tooling.</text>
<text x="240" y="602" class="h2">Local save failure</text>
<rect x="240" y="626" width="900" height="94" rx="8" fill="#ffffff" stroke="#a33a34" stroke-width="2"/>
<rect x="254" y="642" width="16" height="16" rx="4" fill="#ffffff" stroke="#8390a1" stroke-width="1"/>
<text x="282" y="656" class="b" fill="#152238" font-weight="650">Legal — TTA workflow remediation</text>
<text x="282" y="678" class="s" fill="#a33a34" font-weight="700">Change was not saved. Your last committed value is still authoritative.</text>
<text x="282" y="699" class="s" fill="#244b91" font-weight="700">Retry save</text>
<rect x="1170" y="626" width="240" height="94" rx="8" fill="#fff0ef" stroke="#a33a34" stroke-width="1"/>
<text x="1192" y="654" class="b" fill="#a33a34" font-weight="700">Do not show “Saved”</text>
<text x="1192" y="677" class="s" fill="#a33a34">Do not hide this state</text>
<text x="1192" y="698" class="s" fill="#a33a34">behind a transient toast.</text>
<rect x="240" y="752" width="1170" height="84" rx="8" fill="#fff8f7" stroke="#a33a34" stroke-width="1"/>
<text x="262" y="782" class="b" fill="#a33a34" font-weight="700">Sync issue</text>
<text x="262" y="805" class="s" fill="#152238">Local work stays available. Repository reconciliation happens outside Jig; synchronization resumes when the boundary is healthy.</text>
<rect x="1200" y="771" width="182" height="38" rx="7" fill="#ffffff" stroke="#dce3ec" stroke-width="1"/>
<text x="1230" y="796" class="b" fill="#152238">Copy diagnostics</text>
</svg>