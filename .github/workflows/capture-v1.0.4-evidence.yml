name: Capture v1.0.4 UI evidence

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Build production UI
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Capture v1.0.4 governed UI states
        env:
          JIG_CAPTURE_EVIDENCE: "1"
        run: bunx playwright test tests/browser/ui-conformance.spec.ts --grep "temporary v1.0.4 visual evidence capture"
      - name: Upload v1.0.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jig-v1.0.4-ui-evidence
          path: v1.0.4-evidence-output/*.png
          if-no-files-found: error
