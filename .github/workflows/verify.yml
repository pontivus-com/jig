name: Verify v1 implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact dependency graph
        run: bun install
      - name: Typecheck
        run: bun run typecheck
      - name: Core and integration tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock
          path: bun.lock
