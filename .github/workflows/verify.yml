name: Verify v1 implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Core and integration tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Chromium for real-browser acceptance
        run: bunx playwright install --with-deps chromium
      - name: Real-browser acceptance
        run: bun run test:browser
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/jig tests/install/installer-smoke.sh tests/certification/resource-gate.sh tests/certification/installed-readiness-gate.sh
      - name: Installer and lifecycle smoke
        run: bash tests/install/installer-smoke.sh