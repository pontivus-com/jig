name: Verify v1 implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Verify PR release metadata
        if: github.event_name == 'pull_request'
        run: bun scripts/verify-release.ts --mode pr --base origin/master
      - name: Verify release tooling compiles
        run: bun build scripts/package-release.ts scripts/verify-release.ts --target=bun --outdir "${RUNNER_TEMP}/jig-release-tool-check"
      - name: Verify Astryx theme artifacts are current
        run: bun run theme:check
      - name: Typecheck
        run: bun run typecheck
      - name: Core and integration tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Set up Android JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android development APK and native bridge
        run: bun run android:build:debug
      - name: Install Chromium for real-browser acceptance
        run: bunx playwright install --with-deps chromium
      - name: Real-browser acceptance
        run: bun run test:browser
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/installer-smoke.sh tests/certification/resource-gate.sh tests/certification/installed-readiness-gate.sh
      - name: Installer and lifecycle smoke
        run: bash tests/install/installer-smoke.sh
