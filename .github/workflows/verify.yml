name: Verify v1 implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Verify PR release metadata
        if: github.event_name == 'pull_request'
        run: bun scripts/verify-release.ts --mode pr --base origin/master
      - name: Verify release tooling compiles
        run: bun build scripts/package-release.ts scripts/verify-release.ts --target=bun --outdir "${RUNNER_TEMP}/jig-release-tool-check"
      - name: Verify Astryx theme artifacts are current
        run: bun run theme:check
      - name: Typecheck
        run: bun run typecheck
      - name: Core and integration tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Chromium for real-browser acceptance
        run: bunx playwright install --with-deps chromium
      - name: Real-browser acceptance
        run: bun run test:browser
      - name: Capture v1.0.4 visual evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/v1.0.4-ui-interaction-corrections'
        env:
          JIG_CAPTURE_EVIDENCE: "1"
        run: bunx playwright test tests/browser/v1.0.4-evidence.spec.ts
      - name: Upload v1.0.4 visual evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/v1.0.4-ui-interaction-corrections'
        uses: actions/upload-artifact@v4
        with:
          name: jig-v1.0.4-browser-evidence
          path: test-results/v1.0.4-evidence
          if-no-files-found: error
          retention-days: 7
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/installer-smoke.sh tests/certification/resource-gate.sh tests/certification/installed-readiness-gate.sh
      - name: Installer and lifecycle smoke
        run: bash tests/install/installer-smoke.sh
