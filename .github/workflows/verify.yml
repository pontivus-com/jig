name: Verify v1 implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Core and integration tests
        run: bun run test
      - name: Build
        run: bun run build
