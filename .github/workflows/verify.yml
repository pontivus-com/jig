name: Verify v1 implementation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-v106-theme-artifacts:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Resolve v1.0.6 theme dependency graph
        run: bun install
      - name: Generate all Astryx theme artifacts
        run: bun run theme:build
      - name: Commit generated v1.0.6 theme artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add bun.lock ui/src/jig.js ui/src/jig.css ui/src/jig.css.d.ts ui/src/jig.d.ts ui/src/jig.variants.d.ts
          git add 'ui/src/themes/*.js' 'ui/src/themes/*.css' 'ui/src/themes/*.css.d.ts' 'ui/src/themes/*.d.ts' 'ui/src/themes/*.variants.d.ts'
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate v1.0.6 theme artifacts"
          git push origin "HEAD:${{ github.head_ref }}"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Verify PR release metadata
        if: github.event_name == 'pull_request'
        run: bun scripts/verify-release.ts --mode pr --base origin/master
      - name: Verify release tooling compiles
        run: bun build scripts/package-release.ts scripts/verify-release.ts --target=bun --outdir "${RUNNER_TEMP}/jig-release-tool-check"
      - name: Verify Astryx theme artifacts are current
        run: bun run theme:check
      - name: Typecheck
        run: bun run typecheck
      - name: Core and integration tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Install Chromium for real-browser acceptance
        run: bunx playwright install --with-deps chromium
      - name: Real-browser acceptance
        run: bun run test:browser
      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/installer-smoke.sh tests/certification/resource-gate.sh tests/certification/installed-readiness-gate.sh
      - name: Installer and lifecycle smoke
        run: bash tests/install/installer-smoke.sh
