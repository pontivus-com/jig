name: Temporary v1 performance certification

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: jig-v1-performance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resource-certification:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Build production UI
        run: bun run build
      - name: Run canonical V1-24 resource gate
        run: |
          set -o pipefail
          bash tests/certification/resource-gate.sh | tee v1-performance-evidence.txt
      - name: Record hosted-runner identity
        if: always()
        run: |
          {
            echo "github_runner_image: ${ImageOS:-unknown}"
            echo "github_runner_image_version: ${ImageVersion:-unknown}"
            echo "github_run_id: ${GITHUB_RUN_ID}"
            echo "github_sha: ${GITHUB_SHA}"
          } >> v1-performance-evidence.txt
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-performance-evidence
          path: v1-performance-evidence.txt
          if-no-files-found: error
