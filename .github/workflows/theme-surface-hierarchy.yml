name: Apply theme surface hierarchy

on:
  push:
    branches: [v1.1]
    paths:
      - .github/workflows/theme-surface-hierarchy.yml
      - .github/scripts/apply-theme-surface-hierarchy.py

permissions:
  contents: write

concurrency:
  group: theme-surface-hierarchy-v1.1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install exact dependency graph
        run: bun install --frozen-lockfile

      - name: Apply governed surface hierarchy
        run: python3 .github/scripts/apply-theme-surface-hierarchy.py

      - name: Rebuild every authored theme
        run: bun run theme:build

      - name: Verify generated theme drift
        run: bun run theme:check

      - name: Typecheck
        run: bun run typecheck

      - name: Architecture and UI ownership tests
        run: bunx --bun vitest run tests/architecture/ui-ownership.test.ts

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Theme matrix browser acceptance
        run: bunx playwright test tests/browser/ui-conformance.spec.ts --grep "all v1.0.6 themes preserve semantic surfaces"

      - name: Commit exact validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/brand-and-theme.md ui/src tests/architecture/ui-ownership.test.ts tests/browser/ui-conformance.spec.ts
          git commit -m "fix: separate chrome lane and task theme surfaces"
          git push origin HEAD:v1.1
