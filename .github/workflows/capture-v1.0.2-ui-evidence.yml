name: Capture v1.0.2 UI evidence

on:
  push:
    branches: [fix/v1.0.2-ui-ux-remediation]
    paths-ignore:
      - "docs/evidence/v1.0.2/browser/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-ui-ux-remediation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Capture real-browser evidence
        run: bunx playwright test tests/browser/evidence-v1.0.2.spec.ts
      - name: Archive screenshots
        run: |
          git config user.name "Jig Evidence Bot"
          git config user.email "jig-evidence@users.noreply.github.com"
          git add docs/evidence/v1.0.2/browser
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(evidence): archive v1.0.2 browser fidelity screenshots"
          git push origin HEAD:fix/v1.0.2-ui-ux-remediation
