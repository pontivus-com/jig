name: Temporary v1.1 final architecture verification

on:
  push:
    branches:
      - ci/v11-open-canvas-chrome

permissions:
  contents: write

jobs:
  verify-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile

      - name: Assert obsolete remediation is gone
        run: |
          test ! -e .github/workflows/theme-surface-hierarchy.yml
          test ! -e .github/scripts/apply-theme-surface-hierarchy.py
          ! grep -R --line-number --fixed-strings -- '--jig-lane-surface' ui/src
          grep -Fq "expect(common).not.toContain('\"--jig-lane-surface\"')" tests/architecture/ui-ownership.test.ts

      - name: Verify generated theme artifacts
        run: bun run theme:check

      - name: Typecheck
        run: bun run typecheck

      - name: Core integration and architecture tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Full browser acceptance
        run: bun run test:browser

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-v11-open-canvas-chrome.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove temporary v1.1 verification workflow"
          git push origin HEAD:ci/v11-open-canvas-chrome
