name: Generate Jig Astryx theme artifacts

on:
  push:
    branches: [fix/v1.0.2-ui-ux-remediation]
    paths-ignore:
      - "ui/src/jig-theme.generated.*"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-ui-ux-remediation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build theme with pinned Astryx CLI
        run: bunx @astryxdesign/cli@0.7.13 theme build ./ui/src/jig-theme.source.ts --out ./ui/src/jig-theme.generated.css
      - name: Archive generated theme artifacts
        run: |
          git config user.name "Jig Theme Build Bot"
          git config user.email "jig-theme-build@users.noreply.github.com"
          git add -f ui/src/jig-theme.generated.*
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(ui): archive Astryx-generated Jig theme"
          git push origin HEAD:fix/v1.0.2-ui-ux-remediation
