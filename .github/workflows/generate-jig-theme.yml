name: Generate Jig Astryx theme artifacts

on:
  push:
    branches: [fix/v1.0.2-ui-ux-remediation]
    paths-ignore:
      - "ui/src/jig-theme.generated.*"
      - "ui/src/jig.js"
      - "ui/src/jig.d.ts"
      - "ui/src/jig.variants.d.ts"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.2-ui-ux-remediation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Pin Astryx CLI in the frozen development graph
        run: bun add --dev --exact @astryxdesign/cli@0.7.13
      - name: Build theme with pinned Astryx CLI
        run: bunx astryx theme build ./ui/src/jig-theme.source.ts --out ./ui/src/jig-theme.generated.css
      - name: Archive dependency graph and generated theme artifacts
        run: |
          git config user.name "Jig Theme Build Bot"
          git config user.email "jig-theme-build@users.noreply.github.com"
          git add package.json bun.lock
          git add -f ui/src/jig-theme.generated.css ui/src/jig-theme.generated.css.d.ts ui/src/jig.js ui/src/jig.d.ts
          if [[ -f ui/src/jig.variants.d.ts ]]; then
            git add -f ui/src/jig.variants.d.ts
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(ui): pin and archive Astryx theme build"
          git push origin HEAD:fix/v1.0.2-ui-ux-remediation
