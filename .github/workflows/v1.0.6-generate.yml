name: Generate v1.0.6 theme artifacts

on:
  push:
    branches: [fix/v1.0.6-history-settings-width]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.6-history-settings-width
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install and update lockfile
        run: bun install
      - name: Generate all Astryx themes
        run: bun run theme:build
      - name: Commit generated lock and theme artifacts
        run: |
          git add bun.lock ui/src/jig.js ui/src/jig.css ui/src/jig.d.ts ui/src/jig.css.d.ts ui/src/jig.variants.d.ts
          git add ui/src/themes/*.js ui/src/themes/*.css ui/src/themes/*.d.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: generate v1.0.6 theme artifacts"
          git push
