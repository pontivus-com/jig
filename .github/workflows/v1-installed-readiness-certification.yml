name: Temporary v1 installed readiness certification

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: jig-v1-installed-readiness-${{ github.sha }}
  cancel-in-progress: false

jobs:
  installed-readiness:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Create ephemeral personal repository fixture
        run: |
          DATA_REPO="$RUNNER_TEMP/jig-readiness-data"
          mkdir -p "$DATA_REPO"
          git -C "$DATA_REPO" init
          git -C "$DATA_REPO" config user.name "Jig Readiness Certification"
          git -C "$DATA_REPO" config user.email "jig-readiness@local.invalid"
          printf 'fixture\n' > "$DATA_REPO/user.txt"
          git -C "$DATA_REPO" add user.txt
          git -C "$DATA_REPO" commit -m "fixture baseline"
          echo "JIG_READINESS_REPO=$DATA_REPO" >> "$GITHUB_ENV"
      - name: Install Jig through the real installer and user service path
        run: |
          bash scripts/install.sh --repo "$JIG_READINESS_REPO" --port 47942
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run canonical stopped-service readiness gate
        run: |
          set -o pipefail
          bash tests/certification/installed-readiness-gate.sh 2>&1 | tee v1-installed-readiness-evidence.txt
      - name: Record hosted-runner identity
        if: always()
        run: |
          {
            echo "github_runner_image: ${ImageOS:-unknown}"
            echo "github_runner_image_version: ${ImageVersion:-unknown}"
            echo "github_run_id: ${GITHUB_RUN_ID}"
            echo "github_sha: ${GITHUB_SHA}"
          } >> v1-installed-readiness-evidence.txt
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-installed-readiness-evidence
          path: v1-installed-readiness-evidence.txt
          if-no-files-found: error
      - name: Remove ephemeral Jig runtime
        if: always()
        run: |
          if [[ -x "$HOME/.local/bin/jig" ]]; then
            "$HOME/.local/bin/jig" uninstall || true
          fi
