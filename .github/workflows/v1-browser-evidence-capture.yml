name: Temporary v1 browser evidence capture

on:
  push:
    branches: [implementation/v1-mvp]

permissions:
  contents: write

concurrency:
  group: jig-v1-browser-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Build production UI
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Create temporary evidence capture spec
        run: |
          cat > tests/browser/v1-evidence.temp.spec.ts <<'EOF'
          import { mkdir, rename } from "node:fs/promises";
          import { expect, test, type Page } from "@playwright/test";
          import {
            apiCommand,
            apiState,
            browserCivilDate,
            resetCanonicalTasks,
          } from "./helpers";

          const EVIDENCE = "docs/evidence/v1/browser";
          const REMOTE = "/tmp/jig-playwright-remote.git";
          const OFFLINE_REMOTE = "/tmp/jig-playwright-remote.evidence-offline.git";

          async function shot(page: Page, name: string): Promise<void> {
            await page.waitForTimeout(150);
            await page.screenshot({
              path: `${EVIDENCE}/${name}.jpg`,
              type: "jpeg",
              quality: 78,
              fullPage: true,
            });
          }

          async function createTask(
            page: Page,
            title: string,
            scheduledDate: string,
            priority: "HIGH" | "NORMAL" | "LOW" = "NORMAL",
            context: string | null = null,
          ): Promise<void> {
            await apiCommand(page, {
              type: "create",
              title,
              scheduled_date: scheduledDate,
              priority,
              context,
              reference: null,
              note: null,
              reminder_time: null,
            });
          }

          async function triggerSync(page: Page): Promise<void> {
            await page.evaluate(async () => {
              const token = (
                window as typeof window & {
                  __JIG_WRITE_TOKEN__?: string;
                }
              ).__JIG_WRITE_TOKEN__;
              if (token === undefined) {
                throw new Error("Jig write token is unavailable");
              }
              const response = await fetch("/api/v1/sync", {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-jig-write-token": token,
                },
                body: "{}",
              });
              if (!response.ok) {
                throw new Error(`sync trigger failed: ${response.status}`);
              }
            });
          }

          test("capture v1 release-candidate browser evidence", async ({ page }) => {
            await mkdir(EVIDENCE, { recursive: true });
            await page.goto("/");
            await resetCanonicalTasks(page);

            const today = await browserCivilDate(page);
            const yesterday = await browserCivilDate(page, -1);
            const tomorrow = await browserCivilDate(page, 1);

            await createTask(
              page,
              "Review customer acquisition brief",
              yesterday,
              "HIGH",
              "Customer acquisition",
            );
            await createTask(
              page,
              "Prepare contract comments",
              today,
              "HIGH",
              "Pontivus Legal",
            );
            await createTask(
              page,
              "Follow up on design review",
              today,
              "NORMAL",
              "Jig",
            );
            await createTask(
              page,
              "Plan tomorrow's first task",
              tomorrow,
              "LOW",
              "Planning",
            );
            await createTask(
              page,
              "Completed supplier review",
              today,
              "NORMAL",
              "Operations",
            );

            const completed = (await apiState(page)).tasks.find(
              (task) => task.title === "Completed supplier review",
            );
            if (completed === undefined) {
              throw new Error("completed evidence task missing");
            }
            await apiCommand(page, {
              type: "complete",
              task_id: completed.id,
            });

            await page.reload();

            await page.getByRole("button", { name: "Settings", exact: true }).click();
            await page.getByRole("radio", { name: "Light", exact: true }).click();
            await page.getByRole("button", { name: "Week", exact: true }).click();
            await shot(page, "desktop-week-light");

            await page.getByRole("button", { name: "Day", exact: true }).click();
            await expect(page.getByRole("heading", { name: "Carried over" })).toBeVisible();
            await shot(page, "desktop-day-carry-over");

            await page.getByRole("button", { name: "History", exact: true }).click();
            await expect(page.getByText("Completed supplier review", { exact: true })).toBeVisible();
            await shot(page, "desktop-history");

            await page.getByRole("button", { name: "Settings", exact: true }).click();
            await shot(page, "desktop-settings");

            await page.getByRole("radio", { name: "Dark", exact: true }).click();
            await page.getByRole("button", { name: "Week", exact: true }).click();
            await shot(page, "desktop-week-dark");

            await page.setViewportSize({ width: 390, height: 844 });
            await page.getByRole("button", { name: "Day", exact: true }).click();
            await shot(page, "mobile-day");

            await page.getByRole("button", { name: "Add task", exact: true }).click();
            const mobileEditor = page.getByRole("dialog");
            await mobileEditor.getByLabel("Title").fill("Draft from mobile-sized layout");
            await shot(page, "mobile-editor");
            await mobileEditor.getByRole("button", { name: "Cancel", exact: true }).click();

            await page.setViewportSize({ width: 1280, height: 900 });
            await page.route("**/api/v1/commands", async (route) => {
              await route.fulfill({
                status: 500,
                contentType: "text/plain",
                body: "Injected local persistence failure for release evidence",
              });
            });
            await page.getByRole("button", { name: "Add task", exact: true }).click();
            const failureEditor = page.getByRole("dialog");
            await failureEditor.getByLabel("Title").fill("Must remain unsaved");
            await failureEditor.getByRole("button", { name: "Add task", exact: true }).click();
            await expect(
              failureEditor.getByText("Jig request failed with HTTP 500", {
                exact: true,
              }),
            ).toBeVisible();
            await shot(page, "local-save-failure");
            await page.unroute("**/api/v1/commands");
            await failureEditor.getByRole("button", { name: "Cancel", exact: true }).click();

            await rename(REMOTE, OFFLINE_REMOTE);
            try {
              for (let attempt = 0; attempt < 7; attempt += 1) {
                await triggerSync(page);
              }
              await expect.poll(async () =>
                page.evaluate(async () => {
                  const response = await fetch("/api/v1/status");
                  const status = (await response.json()) as {
                    repository_status: string;
                  };
                  return status.repository_status;
                }),
              ).toBe("sync-issue");

              await page.reload();
              await expect(
                page.getByText("Repository synchronization issue", { exact: true }),
              ).toBeVisible();
              await shot(page, "sync-issue");
            } finally {
              await rename(OFFLINE_REMOTE, REMOTE);
              await triggerSync(page);
            }
          });
          EOF
      - name: Capture representative runtime screenshots
        run: bunx playwright test tests/browser/v1-evidence.temp.spec.ts
      - name: Write evidence manifest
        run: |
          cat > docs/evidence/v1/v1-25-browser-evidence.md <<EOF
          # V1-25 browser evidence

          **Captured from revision:** `${GITHUB_SHA}`  
          **Runner:** Ubuntu 26.04 / pinned Bun 1.4.4 / pinned Playwright Chromium  
          **Captured:** 2026-11-16

          These images are screenshots of the running Jig implementation using the real loopback service, SQLite authority, Astryx components and browser HTTP boundary. Fixture Task content is synthetic and exists only in the browser acceptance repository.

          - [Desktop Week — Light](browser/desktop-week-light.jpg)
          - [Desktop Day — carry-over](browser/desktop-day-carry-over.jpg)
          - [Desktop History](browser/desktop-history.jpg)
          - [Desktop Settings](browser/desktop-settings.jpg)
          - [Desktop Week — Dark](browser/desktop-week-dark.jpg)
          - [Mobile-sized Day](browser/mobile-day.jpg)
          - [Mobile-sized editor](browser/mobile-editor.jpg)
          - [Local-save failure](browser/local-save-failure.jpg)
          - [Repository sync issue](browser/sync-issue.jpg)

          The Week Light and Week Dark images also provide the representative Light/Dark parity evidence required by V1-25.
          EOF
      - name: Commit evidence and remove this temporary workflow
        env:
          HEAD_REF: ${{ github.ref_name }}
        run: |
          rm -f tests/browser/v1-evidence.temp.spec.ts
          git rm .github/workflows/v1-browser-evidence-capture.yml
          git add docs/evidence/v1/browser docs/evidence/v1/v1-25-browser-evidence.md
          git config user.name "Jig Evidence Bot"
          git config user.email "jig-evidence@users.noreply.github.com"
          git commit -m "V1-25 archive representative browser evidence"
          git pull --rebase origin "$HEAD_REF"
          git push origin HEAD:"$HEAD_REF"
