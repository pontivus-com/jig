name: Refresh v1.0.6 generated artifacts

on:
  push:
    branches: [fix/v1.0.6-history-settings-width]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.0.6-history-settings-width
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Refresh lock
        run: bun install
      - name: Refresh themes
        run: bun run theme:build
      - name: Commit generated files
        run: |
          git add bun.lock ui/src/jig.js ui/src/jig.css ui/src/jig.d.ts ui/src/jig.css.d.ts ui/src/jig.variants.d.ts
          git add ui/src/themes/*.js ui/src/themes/*.css ui/src/themes/*.d.ts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh v1.0.6 generated artifacts"
          git push
