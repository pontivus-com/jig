name: TEMP v1.1.2 UX/UI visual audit

# TEMPORARY: remove after the v1.1.2 replacement visual-certification
# artifact has been reviewed and its disposition is committed.
on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/v1.1.2-visual-audit-temp.yml"
      - "tests/browser/visual-audit.spec.ts"
      - "ui/**"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-v1.1.2-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install exact frozen dependency graph
        run: bun install --frozen-lockfile
      - name: Typecheck visual audit implementation
        run: bun run typecheck
      - name: Build exact application candidate
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Generate constrained desktop + narrow visual audit
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JIG_VISUAL_AUDIT: "1"
        run: >-
          bunx playwright test tests/browser/visual-audit.spec.ts
          --workers=1
          --grep-invert "Dark"
      - name: Retain exact visual audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jig-v1.1.2-visual-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/**/visual-audit/**
            docs/design/ux-ui-visual-audit-standard.md
          if-no-files-found: error
          retention-days: 14
