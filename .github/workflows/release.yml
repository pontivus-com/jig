name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
      - scripts/package-release.ts
  workflow_dispatch:
    inputs:
      commit:
        description: Exact master commit to release or retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jig-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
      parent_sha: ${{ steps.detect.outputs.parent_sha }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout exact candidate
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/heads/master:refs/remotes/origin/master"
          target_sha="${REQUESTED_TARGET_SHA}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${target_sha}"
          test "$(git rev-parse HEAD)" = "${target_sha}"
          git merge-base --is-ancestor "${target_sha}" refs/remotes/origin/master

      - name: Detect release target
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          trigger_sha="$(git rev-parse HEAD)"
          trigger_parent="$(git rev-parse HEAD^)"
          current="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"

          if git cat-file -e "${trigger_parent}:package.json" 2>/dev/null; then
            previous="$(git show "${trigger_parent}:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          else
            previous=""
          fi

          target_sha=""
          parent_sha=""

          if [[ "${current}" != "${previous}" ]]; then
            target_sha="${trigger_sha}"
            parent_sha="${trigger_parent}"
            echo "Release version transition detected: ${previous:-<none>} -> ${current}"
          else
            tag="v${current}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              echo "Release ${tag} is already tagged; no publication is needed."
              exit 0
            fi

            current_unreleased="$(python3 -c 'from pathlib import Path; t=Path("CHANGELOG.md").read_text(); print(t.split("## [Unreleased]\n",1)[1].split("\n## [",1)[0].strip())')"
            if git cat-file -e "${trigger_parent}:CHANGELOG.md" 2>/dev/null; then
              base_unreleased="$(git show "${trigger_parent}:CHANGELOG.md" | python3 -c 'import sys; t=sys.stdin.read(); print(t.split("## [Unreleased]\n",1)[1].split("\n## [",1)[0].strip())')"
            else
              base_unreleased=""
            fi

            if [[ -z "${current_unreleased}" && -n "${base_unreleased}" ]] && grep -Fq "## [${current}] - " CHANGELOG.md; then
              target_sha="${trigger_sha}"
              parent_sha="${trigger_parent}"
              echo "Same-version pre-tag release finalization detected for v${current}."
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::Target commit is neither a version transition nor a release finalization."
              exit 1
            else
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              echo "No release transition/finalization detected."
              exit 0
            fi
          fi

          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "parent_sha=${parent_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${current}" >> "${GITHUB_OUTPUT}"

      - name: Checkout prepared release target
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.detect.outputs.target_sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.detect.outputs.target_sha }}"
          git merge-base --is-ancestor "${{ steps.detect.outputs.target_sha }}" refs/remotes/origin/master

      - name: Install pinned Bun
        if: steps.detect.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          ln -sf bun "${RUNNER_TEMP}/bun-bin/bunx"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify release metadata before certification
        if: steps.detect.outputs.should_release == 'true'
        run: bun scripts/verify-release.ts --mode release-commit --base "${{ steps.detect.outputs.parent_sha }}"

  android-certification:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force origin "+refs/heads/master:refs/remotes/origin/master"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/master

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install frozen dependency graph
        run: bun install --frozen-lockfile

      - name: Set up Android JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify governed Android source/device contract
        run: bash scripts/verify-android-device-prerequisites.sh --source-only

      - name: Synchronize governed Android project
        run: bun run android:sync

      - name: Verify Gradle dependency locks are current
        shell: bash
        run: |
          set -euo pipefail
          (
            cd android
            ./gradlew :app:dependencies --write-locks >/tmp/jig-gradle-dependencies.txt
          )
          if git status --porcelain -- android | grep -q 'gradle.lockfile'; then
            echo "::error::Gradle dependency locks are missing or stale."
            find android -name gradle.lockfile -type f -print -exec cat {} \;
            exit 1
          fi

      - name: Android unit, static and dependency checks
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:testDebugUnitTest :app:lintDebug
          cd ..
          bash scripts/verify-android-dependencies.sh

      - name: Prove Android release identity and version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"${RELEASE_VERSION}"
          expected_code=$((major * 1000000 + minor * 1000 + patch))
          output="$(bun run android:version:check)"
          printf '%s\n' "$output"
          grep -Fq "JIG_ANDROID_VERSION=${RELEASE_VERSION} JIG_ANDROID_VERSION_CODE=${expected_code}" <<<"$output"
          grep -Fq 'applicationId "com.pontivus.jig"' android/app/build.gradle
          metadata="distribution/fdroid/metadata/com.pontivus.jig.yml"
          grep -Eq '^[[:space:]]+-[[:space:]]+versionName:[[:space:]]+1\.1\.0$' "$metadata"
          grep -Eq '^[[:space:]]+versionCode:[[:space:]]+1001000$' "$metadata"
          grep -Eq '^[[:space:]]+commit:[[:space:]]+v1\.1\.0$' "$metadata"
          grep -Eq '^CurrentVersion:[[:space:]]+1\.1\.0$' "$metadata"
          grep -Eq '^CurrentVersionCode:[[:space:]]+1001000$' "$metadata"

      - name: Build Android release-source candidate
        run: cd android && ./gradlew :app:assembleRelease

      - name: Lint candidate F-Droid metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/fdroid-venv"
          "${RUNNER_TEMP}/fdroid-venv/bin/pip" install "fdroidserver==2.4.5"
          mkdir -p "${RUNNER_TEMP}/fdroid-data/config" "${RUNNER_TEMP}/fdroid-data/metadata"
          categories_catalog="${RUNNER_TEMP}/fdroid-data/categories-authority.yml"
          curl -fsSLo "${categories_catalog}" "https://raw.githubusercontent.com/f-droid/fdroiddata/6e52e1ad56721f12c49f48d936e9da05ef740d91/config/categories.yml"
          "${RUNNER_TEMP}/fdroid-venv/bin/python" - "${categories_catalog}" "${RUNNER_TEMP}/fdroid-data/config/categories.yml" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          categories = yaml.safe_load(source.read_text())
          if not isinstance(categories, dict) or "Task" not in categories:
              raise SystemExit("Pinned F-Droid category authority has no Task category")
          target.write_text(yaml.safe_dump({"Task": categories["Task"]}, sort_keys=False))
          PY
          grep -Fq "Task:" "${RUNNER_TEMP}/fdroid-data/config/categories.yml"
          cp distribution/fdroid/metadata/com.pontivus.jig.yml "${RUNNER_TEMP}/fdroid-data/metadata/"
          (
            cd "${RUNNER_TEMP}/fdroid-data"
            "${RUNNER_TEMP}/fdroid-venv/bin/fdroid" lint com.pontivus.jig
          )

  arm64-certification:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force origin "+refs/heads/master:refs/remotes/origin/master"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/master

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-aarch64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          ln -sf bun "${RUNNER_TEMP}/bun-bin/bunx"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify arm64 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.4.4"
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
          bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/release-bundle-smoke.sh scripts/verify-android-dependencies.sh scripts/verify-android-device-prerequisites.sh
          bash tests/install/installer-smoke.sh

      - name: Package and smoke certified arm64 bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh scripts/jig scripts/install-release.sh
          output="${RUNNER_TEMP}/jig-arm64-release"
          bun scripts/package-release.ts "${output}"
          (cd "${output}" && sha256sum -c SHA256SUMS)

          smoke="${RUNNER_TEMP}/jig-arm64-release-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}"
          tar -xzf "${output}/jig-linux-arm64.tar.gz" -C "${smoke}"
          bash tests/install/release-bundle-smoke.sh \
            "${smoke}/jig" "${smoke}/matrix" 47931

  release:
    needs: [prepare, arm64-certification, android-certification]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUESTED_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/heads/master:refs/remotes/origin/master"
          target_sha="${REQUESTED_TARGET_SHA}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${target_sha}"
          test "$(git rev-parse HEAD)" = "${target_sha}"
          git merge-base --is-ancestor "${target_sha}" refs/remotes/origin/master
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          ln -sf bun "${RUNNER_TEMP}/bun-bin/bunx"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify release metadata
        run: bun scripts/verify-release.ts --mode release-commit --base "${{ needs.prepare.outputs.parent_sha }}"

      - name: Install frozen dependency graph
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Core and integration tests
        run: bun run test

      - name: Build production UI
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Real-browser acceptance
        run: bun run test:browser

      - name: Shell and installer certification
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/release-bundle-smoke.sh scripts/verify-android-dependencies.sh scripts/verify-android-device-prerequisites.sh
          bash tests/install/installer-smoke.sh

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          # Release candidates created through the contents API may not carry
          # executable Git mode bits. Normalize the runtime entrypoints before
          # packaging; package-release.ts also owns this permanently for future
          # release commits.
          chmod +x scripts/install.sh scripts/jig scripts/install-release.sh
          bun scripts/package-release.ts
          (cd release && sha256sum -c SHA256SUMS)
          test -s release/release-notes.md

      - name: Smoke certified x64 bundle
        shell: bash
        run: |
          set -euo pipefail
          smoke="${RUNNER_TEMP}/jig-release-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}"
          tar -xzf release/jig-linux-x64.tar.gz -C "${smoke}"
          bash tests/install/release-bundle-smoke.sh \
            "${smoke}/jig" "${smoke}/matrix" 47931

      - name: Create or verify annotated tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n1 "${tag}")" = "${TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${TARGET_SHA}" -m "Jig ${version}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create upload and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v${version}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"

          code="$(curl -sS -o "${RUNNER_TEMP}/existing-release.json" -w '%{http_code}'             -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/releases/tags/${tag}")"

          if [[ "${code}" == "404" ]]; then
            RELEASE_NOTES="release/release-notes.md" CREATE_JSON="${RUNNER_TEMP}/create-release.json" RELEASE_TAG="${tag}" RELEASE_SHA="${TARGET_SHA}"               bun -e 'const body=await Bun.file(process.env.RELEASE_NOTES).text(); await Bun.write(process.env.CREATE_JSON, JSON.stringify({tag_name:process.env.RELEASE_TAG,target_commitish:process.env.RELEASE_SHA,name:"Jig "+process.env.RELEASE_TAG.slice(1),body,draft:true,prerelease:false}));'
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/vnd.github+json"               -d @"${RUNNER_TEMP}/create-release.json" "${api}/releases" > "${RUNNER_TEMP}/release.json"
          elif [[ "${code}" == "200" ]]; then
            cp "${RUNNER_TEMP}/existing-release.json" "${RUNNER_TEMP}/release.json"
          else
            cat "${RUNNER_TEMP}/existing-release.json" >&2
            exit 1
          fi

          release_id="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.id));')"
          is_draft="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.draft));')"
          if [[ "${is_draft}" != "true" ]]; then
            exit 0
          fi

          for asset in jig-linux-x64.tar.gz jig-linux-arm64.tar.gz SHA256SUMS jig-install.sh; do
            existing_url="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" ASSET_NAME="${asset}" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); const a=(r.assets??[]).find(x=>x.name===process.env.ASSET_NAME); process.stdout.write(a?.url??"");')"
            if [[ -n "${existing_url}" ]]; then
              existing_asset="${RUNNER_TEMP}/existing-${asset}"
              curl -fsS -L -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"                 -H "Accept: application/octet-stream" "${existing_url}" -o "${existing_asset}"
              cmp -s "release/${asset}" "${existing_asset}"
              continue
            fi
            content_type="application/octet-stream"
            [[ "${asset}" == "SHA256SUMS" || "${asset}" == *.sh ]] && content_type="text/plain"
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: ${content_type}" --data-binary @"release/${asset}"               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" >/dev/null
          done

          curl -fsS -X PATCH -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/vnd.github+json"             -d '{"draft":false}' "${api}/releases/${release_id}" >/dev/null
