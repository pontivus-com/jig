name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      commit:
        description: Exact master commit to release or retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: jig-release
  cancel-in-progress: false

jobs:
  arm64-certification:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force origin "+refs/heads/master:refs/remotes/origin/master"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/master

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-aarch64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify arm64 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.4.4"
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
          bash -n scripts/install.sh scripts/jig scripts/install-release.sh
          bash tests/install/installer-smoke.sh

  release:
    needs: arm64-certification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUESTED_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/heads/master:refs/remotes/origin/master"
          target_sha="${REQUESTED_TARGET_SHA}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${target_sha}"
          test "$(git rev-parse HEAD)" = "${target_sha}"
          git merge-base --is-ancestor "${target_sha}" refs/remotes/origin/master
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Detect release version change
        id: release-change
        shell: bash
        run: |
          set -euo pipefail
          current="$(bun -e 'process.stdout.write(JSON.parse(await Bun.file("package.json").text()).version)')"
          parent="$(git rev-parse HEAD^)"
          previous="$(git show "${parent}:package.json" | bun -e 'let s=""; const d=new TextDecoder(); for await (const c of Bun.stdin.stream()) s+=d.decode(c,{stream:true}); s+=d.decode(); process.stdout.write(JSON.parse(s).version)')"
          if [[ "${current}" == "${previous}" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "version=${current}" >> "${GITHUB_OUTPUT}"
            echo "parent=${parent}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify release metadata
        if: steps.release-change.outputs.changed == 'true'
        run: bun scripts/verify-release.ts --mode release-commit --base "${{ steps.release-change.outputs.parent }}"

      - name: Install frozen dependency graph
        if: steps.release-change.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.release-change.outputs.changed == 'true'
        run: bun run typecheck

      - name: Core and integration tests
        if: steps.release-change.outputs.changed == 'true'
        run: bun run test

      - name: Build production UI
        if: steps.release-change.outputs.changed == 'true'
        run: bun run build

      - name: Install Chromium
        if: steps.release-change.outputs.changed == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Real-browser acceptance
        if: steps.release-change.outputs.changed == 'true'
        run: bun run test:browser

      - name: Shell and installer certification
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh scripts/jig scripts/install-release.sh
          bash tests/install/installer-smoke.sh

      - name: Build release assets
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/package-release.ts
          (cd release && sha256sum -c SHA256SUMS)
          test -s release/release-notes.md

      - name: Smoke certified x64 bundle
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          smoke="${RUNNER_TEMP}/jig-release-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}/home" "${smoke}/repo"
          git -C "${smoke}/repo" init -q
          git -C "${smoke}/repo" config user.name "Jig Release"
          git -C "${smoke}/repo" config user.email "release@example.invalid"
          tar -xzf release/jig-linux-x64.tar.gz -C "${smoke}"
          HOME="${smoke}/home" "${smoke}/jig/scripts/install.sh"             --repo "${smoke}/repo" --port 47931
          HOME="${smoke}/home" "${smoke}/home/.local/bin/jig" status
          HOME="${smoke}/home" "${smoke}/home/.local/bin/jig" uninstall

      - name: Create or verify annotated tag
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-change.outputs.version }}"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n1 "${tag}")" = "${TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${TARGET_SHA}" -m "Jig ${version}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create upload and publish GitHub Release
        if: steps.release-change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-change.outputs.version }}"
          tag="v${version}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"

          code="$(curl -sS -o "${RUNNER_TEMP}/existing-release.json" -w '%{http_code}'             -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/releases/tags/${tag}")"

          if [[ "${code}" == "404" ]]; then
            RELEASE_NOTES="release/release-notes.md" CREATE_JSON="${RUNNER_TEMP}/create-release.json" RELEASE_TAG="${tag}" RELEASE_SHA="${TARGET_SHA}"               bun -e 'const body=await Bun.file(process.env.RELEASE_NOTES).text(); await Bun.write(process.env.CREATE_JSON, JSON.stringify({tag_name:process.env.RELEASE_TAG,target_commitish:process.env.RELEASE_SHA,name:"Jig "+process.env.RELEASE_TAG.slice(1),body,draft:true,prerelease:false}));'
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/vnd.github+json"               -d @"${RUNNER_TEMP}/create-release.json" "${api}/releases" > "${RUNNER_TEMP}/release.json"
          elif [[ "${code}" == "200" ]]; then
            cp "${RUNNER_TEMP}/existing-release.json" "${RUNNER_TEMP}/release.json"
          else
            cat "${RUNNER_TEMP}/existing-release.json" >&2
            exit 1
          fi

          release_id="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.id));')"
          is_draft="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.draft));')"
          if [[ "${is_draft}" != "true" ]]; then
            exit 0
          fi

          for asset in jig-linux-x64.tar.gz jig-linux-arm64.tar.gz SHA256SUMS jig-install.sh; do
            existing_url="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" ASSET_NAME="${asset}" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); const a=(r.assets??[]).find(x=>x.name===process.env.ASSET_NAME); process.stdout.write(a?.url??"");')"
            if [[ -n "${existing_url}" ]]; then
              existing_asset="${RUNNER_TEMP}/existing-${asset}"
              curl -fsS -L -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"                 -H "Accept: application/octet-stream" "${existing_url}" -o "${existing_asset}"
              cmp -s "release/${asset}" "${existing_asset}"
              continue
            fi
            content_type="application/octet-stream"
            [[ "${asset}" == "SHA256SUMS" || "${asset}" == *.sh ]] && content_type="text/plain"
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: ${content_type}" --data-binary @"release/${asset}"               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" >/dev/null
          done

          curl -fsS -X PATCH -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/vnd.github+json"             -d '{"draft":false}' "${api}/releases/${release_id}" >/dev/null
