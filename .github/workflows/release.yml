name: Release

on:
  push:
    branches: [master]
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
      - scripts/package-release.ts
  workflow_dispatch:
    inputs:
      commit:
        description: Exact master commit to release or retry; optional for the bounded v1.1.2 Android completion
        required: false
        default: ""
        type: string
      android_v1_1_2_completion:
        description: Build, sign, verify and append jig-android.apk to the existing v1.1.2 GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: jig-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      android_completion: ${{ steps.detect.outputs.android_completion }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
      parent_sha: ${{ steps.detect.outputs.parent_sha }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout exact candidate
        shell: bash
        env:
          REQUESTED_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.android_v1_1_2_completion && 'ef9aa1847209d651cb8d01fefd23506b0afdd807' || (github.event_name == 'workflow_dispatch' && inputs.commit || github.sha) }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/heads/master:refs/remotes/origin/master"
          target_sha="${REQUESTED_TARGET_SHA}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::A 40-character commit SHA is required for a manual release retry."
            exit 1
          }
          git checkout --detach "${target_sha}"
          test "$(git rev-parse HEAD)" = "${target_sha}"
          git merge-base --is-ancestor "${target_sha}" refs/remotes/origin/master

      - name: Detect release target
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.android_v1_1_2_completion }}" == "true" ]]; then
            expected_sha="ef9aa1847209d651cb8d01fefd23506b0afdd807"
            tag="v1.1.2"
            tag_sha="$(git rev-list -n1 "refs/tags/${tag}")"
            test "${tag_sha}" = "${expected_sha}"
            git merge-base --is-ancestor "${expected_sha}" refs/remotes/origin/master
            parent_sha="$(git rev-parse "${expected_sha}^")"
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "android_completion=true" >> "${GITHUB_OUTPUT}"
            echo "target_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"
            echo "parent_sha=${parent_sha}" >> "${GITHUB_OUTPUT}"
            echo "version=1.1.2" >> "${GITHUB_OUTPUT}"
            {
              echo "## v1.1.2 Android APK completion"
              echo ""
              echo "- Source tag: `v1.1.2`"
              echo "- Source commit: `${expected_sha}`"
              echo "- Output: production-signed `jig-android.apk`"
              echo "- Destination: existing GitHub Release `v1.1.2`"
              echo "- Store publication: none"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "Bounded Android APK completion selected for immutable v1.1.2."
            exit 0
          fi

          echo "android_completion=false" >> "${GITHUB_OUTPUT}"
          trigger_sha="$(git rev-parse HEAD)"
          trigger_parent="$(git rev-parse HEAD^)"
          current="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"

          if git cat-file -e "${trigger_parent}:package.json" 2>/dev/null; then
            previous="$(git show "${trigger_parent}:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          else
            previous=""
          fi

          target_sha=""
          parent_sha=""

          # A released version is not complete while a governed required asset is absent.
          # v1.1.2 predates the corrected Android asset matrix, so reconcile that one
          # known incomplete release automatically from its immutable source tag.
          if [[ "${{ github.event_name }}" == "push" && "${current}" == "1.1.2" ]]; then
            expected_sha="ef9aa1847209d651cb8d01fefd23506b0afdd807"
            tag="v1.1.2"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              tag_sha="$(git rev-list -n1 "refs/tags/${tag}")"
              test "${tag_sha}" = "${expected_sha}"
              git merge-base --is-ancestor "${expected_sha}" refs/remotes/origin/master

              api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
              release_json="${RUNNER_TEMP}/v1.1.2-release.json"
              code="$(curl -sS -o "${release_json}" -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}")"
              [[ "${code}" == "200" ]] || {
                cat "${release_json}" >&2 || true
                echo "::error::Expected existing published v1.1.2 GitHub Release while reconciling required Android asset."
                exit 1
              }

              has_android="$(RELEASE_JSON="${release_json}" python3 -c 'import json,os; r=json.load(open(os.environ["RELEASE_JSON"])); print("true" if any(a.get("name")=="jig-android.apk" for a in r.get("assets",[])) else "false")')"
              if [[ "${has_android}" != "true" ]]; then
                parent_sha="$(git rev-parse "${expected_sha}^")"
                echo "should_release=false" >> "${GITHUB_OUTPUT}"
                echo "android_completion=true" >> "${GITHUB_OUTPUT}"
                echo "target_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"
                echo "parent_sha=${parent_sha}" >> "${GITHUB_OUTPUT}"
                echo "version=1.1.2" >> "${GITHUB_OUTPUT}"
                {
                  echo "## v1.1.2 Android APK reconciliation"
                  echo ""
                  echo "- Existing release is missing required `jig-android.apk`."
                  echo "- Source tag: `v1.1.2`"
                  echo "- Source commit: `${expected_sha}`"
                  echo "- Action: build, sign, verify and append Android APK/checksum."
                  echo "- Store publication: none"
                } >> "${GITHUB_STEP_SUMMARY}"
                echo "Incomplete v1.1.2 release detected: reconciling required Android APK."
                exit 0
              fi
            fi
          fi

          if [[ "${current}" != "${previous}" ]]; then
            target_sha="${trigger_sha}"
            parent_sha="${trigger_parent}"
            echo "Release version transition detected: ${previous:-<none>} -> ${current}"
          else
            tag="v${current}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              current_unreleased="$(python3 -c 'from pathlib import Path; t=Path("CHANGELOG.md").read_text(); print(t.split("## [Unreleased]\n",1)[1].split("\n## [",1)[0].strip())')"
              target_release="$(printf '%s' "${current_unreleased}" | python3 -c 'import re,sys; m=re.search(r"Target release:\s*v?([0-9]+\.[0-9]+\.[0-9]+)", sys.stdin.read(), re.I); print(m.group(1) if m else "")')"
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              echo "NO RELEASE: ${tag} is already tagged; this workflow run did not certify or publish a new version."
              {
                echo "## Release disposition: NO RELEASE"
                echo ""
                echo "- Current package version: \`${current}\`"
                echo "- Existing immutable tag: \`${tag}\`"
                echo "- Trigger commit: \`${trigger_sha}\`"
                if [[ -n "${target_release}" && "${target_release}" != "${current}" ]]; then
                  echo "- Pending target from \`[Unreleased]\`: \`v${target_release}\`"
                  echo "- Required ceremonial transition: create/merge \`release/v${target_release}\`; this run is not release success for that target."
                else
                  echo "- No new package-version transition was detected."
                fi
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            current_unreleased="$(python3 -c 'from pathlib import Path; t=Path("CHANGELOG.md").read_text(); print(t.split("## [Unreleased]\n",1)[1].split("\n## [",1)[0].strip())')"
            if git cat-file -e "${trigger_parent}:CHANGELOG.md" 2>/dev/null; then
              base_unreleased="$(git show "${trigger_parent}:CHANGELOG.md" | python3 -c 'import sys; t=sys.stdin.read(); print(t.split("## [Unreleased]\n",1)[1].split("\n## [",1)[0].strip())')"
            else
              base_unreleased=""
            fi

            if [[ -z "${current_unreleased}" && -n "${base_unreleased}" ]] && grep -Fq "## [${current}] - " CHANGELOG.md; then
              target_sha="${trigger_sha}"
              parent_sha="${trigger_parent}"
              echo "Same-version pre-tag release finalization detected for v${current}."
            elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo "::error::Target commit is neither a version transition nor a release finalization."
              exit 1
            else
              target_release="$(printf '%s' "${current_unreleased}" | python3 -c 'import re,sys; m=re.search(r"Target release:\s*v?([0-9]+\.[0-9]+\.[0-9]+)", sys.stdin.read(), re.I); print(m.group(1) if m else "")')"
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              echo "NO RELEASE: no release transition/finalization detected; certification/publication jobs will be skipped."
              {
                echo "## Release disposition: NO RELEASE"
                echo ""
                echo "- Current package version: \`${current}\`"
                echo "- Trigger commit: \`${trigger_sha}\`"
                if [[ -n "${target_release}" && "${target_release}" != "${current}" ]]; then
                  echo "- Pending target from \`[Unreleased]\`: \`v${target_release}\`"
                  echo "- Required ceremonial transition: create/merge \`release/v${target_release}\`."
                else
                  echo "- No package-version transition or same-version release finalization was detected."
                fi
              } >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "parent_sha=${parent_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${current}" >> "${GITHUB_OUTPUT}"

      - name: Checkout prepared release target
        if: steps.detect.outputs.should_release == 'true' || steps.detect.outputs.android_completion == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.detect.outputs.target_sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.detect.outputs.target_sha }}"
          git merge-base --is-ancestor "${{ steps.detect.outputs.target_sha }}" refs/remotes/origin/master

      - name: Install pinned Bun
        if: steps.detect.outputs.should_release == 'true' || steps.detect.outputs.android_completion == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          ln -sf bun "${RUNNER_TEMP}/bun-bin/bunx"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify release metadata before certification
        if: steps.detect.outputs.should_release == 'true' || steps.detect.outputs.android_completion == 'true'
        run: bun scripts/verify-release.ts --mode release-commit --base "${{ steps.detect.outputs.parent_sha }}"

  android-certification:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' || needs.prepare.outputs.android_completion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force origin "+refs/heads/master:refs/remotes/origin/master"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/master

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install frozen dependency graph
        run: bun install --frozen-lockfile

      - name: Set up Android JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Ensure Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Verify governed Android source/device contract
        run: bash scripts/verify-android-device-prerequisites.sh --source-only

      - name: Synchronize governed Android project
        run: bun run android:sync

      - name: Verify Gradle dependency locks are current
        shell: bash
        run: |
          set -euo pipefail
          (
            cd android
            ./gradlew :app:dependencies --write-locks >/tmp/jig-gradle-dependencies.txt
          )
          if git status --porcelain -- android | grep -q 'gradle.lockfile'; then
            echo "::error::Gradle dependency locks are missing or stale."
            find android -name gradle.lockfile -type f -print -exec cat {} \;
            exit 1
          fi

      - name: Android unit, static and dependency checks
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:testDebugUnitTest :app:lintDebug
          cd ..
          bash scripts/verify-android-dependencies.sh

      - name: Prove Android release identity and version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor patch <<<"${RELEASE_VERSION}"
          expected_code=$((major * 1000000 + minor * 1000 + patch))
          output="$(bun run android:version:check)"
          printf '%s\n' "$output"
          grep -Fq "JIG_ANDROID_VERSION=${RELEASE_VERSION} JIG_ANDROID_VERSION_CODE=${expected_code}" <<<"$output"
          grep -Fq 'applicationId "com.pontivus.jig"' android/app/build.gradle

      - name: Build Android release-source candidate
        run: cd android && ./gradlew :app:assembleRelease

      - name: Sign and verify production Android release APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          JIG_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.JIG_ANDROID_RELEASE_KEYSTORE_B64 }}
          JIG_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.JIG_ANDROID_RELEASE_STORE_PASSWORD }}
          JIG_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.JIG_ANDROID_RELEASE_KEY_ALIAS }}
          JIG_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.JIG_ANDROID_RELEASE_KEY_PASSWORD }}
          JIG_ANDROID_RELEASE_CERT_SHA256: ${{ secrets.JIG_ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in JIG_ANDROID_RELEASE_KEYSTORE_B64 JIG_ANDROID_RELEASE_STORE_PASSWORD JIG_ANDROID_RELEASE_KEY_ALIAS JIG_ANDROID_RELEASE_KEY_PASSWORD JIG_ANDROID_RELEASE_CERT_SHA256; do
            test -n "${!name:-}" || { echo "::error::Missing protected Android release credential: ${name}"; exit 1; }
          done

          keystore="${RUNNER_TEMP}/jig-android-release.keystore"
          printf '%s' "${JIG_ANDROID_RELEASE_KEYSTORE_B64}" | base64 --decode > "${keystore}"
          chmod 0600 "${keystore}"
          test -s "${keystore}"

          mapfile -t candidates < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          (( ${#candidates[@]} == 1 )) || { echo "::error::Expected exactly one release APK candidate; found ${#candidates[@]}"; exit 1; }
          unsigned_apk="${candidates[0]}"
          signed_apk="${RUNNER_TEMP}/jig-android.apk"
          apksigner="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          aapt="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -x "${apksigner}"
          test -x "${aapt}"

          "${apksigner}" sign \
            --ks "${keystore}" \
            --ks-key-alias "${JIG_ANDROID_RELEASE_KEY_ALIAS}" \
            --ks-pass env:JIG_ANDROID_RELEASE_STORE_PASSWORD \
            --key-pass env:JIG_ANDROID_RELEASE_KEY_PASSWORD \
            --out "${signed_apk}" \
            "${unsigned_apk}"

          "${apksigner}" verify --verbose --print-certs "${signed_apk}" > "${RUNNER_TEMP}/jig-android-signature.txt"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${RUNNER_TEMP}/jig-android-signature.txt" | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected_cert="$(printf '%s' "${JIG_ANDROID_RELEASE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          certification_cert="a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc"
          test -n "${actual_cert}"
          test "${actual_cert}" = "${expected_cert}"
          test "${actual_cert}" != "${certification_cert}" || { echo "::error::Production APK is signed by the non-production certification identity"; exit 1; }

          IFS=. read -r major minor patch <<<"${RELEASE_VERSION}"
          expected_code=$((major * 1000000 + minor * 1000 + patch))
          badging="$("${aapt}" dump badging "${signed_apk}" | head -1)"
          grep -Fq "name='com.pontivus.jig'" <<<"${badging}"
          grep -Fq "versionName='${RELEASE_VERSION}'" <<<"${badging}"
          grep -Fq "versionCode='${expected_code}'" <<<"${badging}"
          sha256sum "${signed_apk}"

      - name: Retain production Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: jig-android-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/jig-android.apk
          if-no-files-found: error
          retention-days: 7

  arm64-certification:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force origin "+refs/heads/master:refs/remotes/origin/master"
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${TARGET_SHA}"
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          git merge-base --is-ancestor "${TARGET_SHA}" refs/remotes/origin/master

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-aarch64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-aarch64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          ln -sf bun "${RUNNER_TEMP}/bun-bin/bunx"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify arm64 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = "1.4.4"
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
          bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/release-bundle-smoke.sh scripts/verify-android-dependencies.sh scripts/verify-android-device-prerequisites.sh
          bash tests/install/installer-smoke.sh

      - name: Package and smoke certified arm64 bundle
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh scripts/jig scripts/install-release.sh
          output="${RUNNER_TEMP}/jig-arm64-release"
          bun scripts/package-release.ts "${output}"
          (cd "${output}" && sha256sum -c SHA256SUMS)

          smoke="${RUNNER_TEMP}/jig-arm64-release-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}"
          tar -xzf "${output}/jig-linux-arm64.tar.gz" -C "${smoke}"
          bash tests/install/release-bundle-smoke.sh \
            "${smoke}/jig" "${smoke}/matrix" 47931

  release:
    needs: [prepare, arm64-certification, android-certification]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUESTED_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/heads/master:refs/remotes/origin/master"
          target_sha="${REQUESTED_TARGET_SHA}"
          [[ "${target_sha}" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${target_sha}"
          test "$(git rev-parse HEAD)" = "${target_sha}"
          git merge-base --is-ancestor "${target_sha}" refs/remotes/origin/master
          echo "TARGET_SHA=${target_sha}" >> "${GITHUB_ENV}"

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/bun.zip"             "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
          unzip -q "${RUNNER_TEMP}/bun.zip" -d "${RUNNER_TEMP}/bun-unpack"
          mkdir -p "${RUNNER_TEMP}/bun-bin"
          cp "${RUNNER_TEMP}/bun-unpack/bun-linux-x64/bun" "${RUNNER_TEMP}/bun-bin/bun"
          ln -sf bun "${RUNNER_TEMP}/bun-bin/bunx"
          chmod +x "${RUNNER_TEMP}/bun-bin/bun"
          echo "${RUNNER_TEMP}/bun-bin" >> "${GITHUB_PATH}"

      - name: Verify release metadata
        run: bun scripts/verify-release.ts --mode release-commit --base "${{ needs.prepare.outputs.parent_sha }}"

      - name: Install frozen dependency graph
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Core and integration tests
        run: bun run test

      - name: Build production UI
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Real-browser acceptance
        run: bun run test:browser

      - name: Shell and installer certification
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh scripts/jig scripts/install-release.sh tests/install/release-bundle-smoke.sh scripts/verify-android-dependencies.sh scripts/verify-android-device-prerequisites.sh
          bash tests/install/installer-smoke.sh

      - name: Download signed Android release APK
        uses: actions/download-artifact@v4
        with:
          name: jig-android-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/jig-android-release

      - name: Build release assets
        shell: bash
        env:
          JIG_ANDROID_RELEASE_APK: ${{ runner.temp }}/jig-android-release/jig-android.apk
        run: |
          set -euo pipefail
          # Release candidates created through the contents API may not carry
          # executable Git mode bits. Normalize the runtime entrypoints before
          # packaging; package-release.ts also owns this permanently for future
          # release commits.
          chmod +x scripts/install.sh scripts/jig scripts/install-release.sh
          test -s "${JIG_ANDROID_RELEASE_APK}"
          bun scripts/package-release.ts
          (cd release && sha256sum -c SHA256SUMS)
          grep -Fq '  jig-android.apk' release/SHA256SUMS
          test -s release/release-notes.md

      - name: Smoke certified x64 bundle
        shell: bash
        run: |
          set -euo pipefail
          smoke="${RUNNER_TEMP}/jig-release-smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}"
          tar -xzf release/jig-linux-x64.tar.gz -C "${smoke}"
          bash tests/install/release-bundle-smoke.sh \
            "${smoke}/jig" "${smoke}/matrix" 47931

      - name: Create or verify annotated tag
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            test "$(git rev-list -n1 "${tag}")" = "${TARGET_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${TARGET_SHA}" -m "Jig ${version}"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create upload and publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          tag="v${version}"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"

          code="$(curl -sS -o "${RUNNER_TEMP}/existing-release.json" -w '%{http_code}'             -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"             "${api}/releases/tags/${tag}")"

          if [[ "${code}" == "404" ]]; then
            RELEASE_NOTES="release/release-notes.md" CREATE_JSON="${RUNNER_TEMP}/create-release.json" RELEASE_TAG="${tag}" RELEASE_SHA="${TARGET_SHA}"               bun -e 'const body=await Bun.file(process.env.RELEASE_NOTES).text(); await Bun.write(process.env.CREATE_JSON, JSON.stringify({tag_name:process.env.RELEASE_TAG,target_commitish:process.env.RELEASE_SHA,name:"Jig "+process.env.RELEASE_TAG.slice(1),body,draft:true,prerelease:false}));'
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: application/vnd.github+json"               -d @"${RUNNER_TEMP}/create-release.json" "${api}/releases" > "${RUNNER_TEMP}/release.json"
          elif [[ "${code}" == "200" ]]; then
            cp "${RUNNER_TEMP}/existing-release.json" "${RUNNER_TEMP}/release.json"
          else
            cat "${RUNNER_TEMP}/existing-release.json" >&2
            exit 1
          fi

          release_id="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.id));')"
          is_draft="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); process.stdout.write(String(r.draft));')"
          if [[ "${is_draft}" != "true" ]]; then
            exit 0
          fi

          for asset in jig-linux-x64.tar.gz jig-linux-arm64.tar.gz jig-android.apk SHA256SUMS jig-install.sh; do
            existing_url="$(RELEASE_JSON="${RUNNER_TEMP}/release.json" ASSET_NAME="${asset}" bun -e 'const r=JSON.parse(await Bun.file(process.env.RELEASE_JSON).text()); const a=(r.assets??[]).find(x=>x.name===process.env.ASSET_NAME); process.stdout.write(a?.url??"");')"
            if [[ -n "${existing_url}" ]]; then
              existing_asset="${RUNNER_TEMP}/existing-${asset}"
              curl -fsS -L -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"                 -H "Accept: application/octet-stream" "${existing_url}" -o "${existing_asset}"
              cmp -s "release/${asset}" "${existing_asset}"
              continue
            fi
            content_type="application/octet-stream"
            [[ "${asset}" == "jig-android.apk" ]] && content_type="application/vnd.android.package-archive"
            [[ "${asset}" == "SHA256SUMS" || "${asset}" == *.sh ]] && content_type="text/plain"
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"               -H "Content-Type: ${content_type}" --data-binary @"release/${asset}"               "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" >/dev/null
          done

          curl -fsS -X PATCH -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/vnd.github+json"             -d '{"draft":false}' "${api}/releases/${release_id}" >/dev/null

  android-v1-1-2-completion:
    needs: [prepare, android-certification]
    if: needs.prepare.outputs.android_completion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download governed signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: jig-android-release-1.1.2
          path: ${{ runner.temp }}/jig-android-completion

      - name: Append only the bounded v1.1.2 Android completion assets
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="ef9aa1847209d651cb8d01fefd23506b0afdd807"
          tag="v1.1.2"
          apk_dir="${RUNNER_TEMP}/jig-android-completion"
          apk="${apk_dir}/jig-android.apk"
          test -s "${apk}"

          git init "${RUNNER_TEMP}/jig-v1.1.2-source"
          cd "${RUNNER_TEMP}/jig-v1.1.2-source"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          test "$(git rev-list -n1 "refs/tags/${tag}")" = "${expected_sha}"

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          release_json="${RUNNER_TEMP}/jig-v1.1.2-release.json"
          curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/releases/tags/${tag}" > "${release_json}"

          RELEASE_JSON="${release_json}" EXPECTED_SHA="${expected_sha}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path(os.environ['RELEASE_JSON']).read_text())
          assert release['tag_name'] == 'v1.1.2'
          assert release['target_commitish'] == os.environ['EXPECTED_SHA']
          assert release['draft'] is False
          assert release['prerelease'] is False
          names = {asset['name'] for asset in release.get('assets', [])}
          required = {'jig-linux-x64.tar.gz', 'jig-linux-arm64.tar.gz', 'SHA256SUMS', 'jig-install.sh'}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'v1.1.2 legacy release is missing required existing assets: {missing}')
          PY

          cd "${apk_dir}"
          sha256sum jig-android.apk > jig-android.apk.sha256
          release_id="$(RELEASE_JSON="${release_json}" python3 -c 'import json,os; print(json.load(open(os.environ["RELEASE_JSON"]))["id"])')"

          for asset in jig-android.apk jig-android.apk.sha256; do
            existing_url="$(RELEASE_JSON="${release_json}" ASSET_NAME="${asset}" python3 -c 'import json,os; r=json.load(open(os.environ["RELEASE_JSON"])); print(next((a["url"] for a in r.get("assets",[]) if a["name"]==os.environ["ASSET_NAME"]), ""))')"
            if [[ -n "${existing_url}" ]]; then
              existing_asset="${RUNNER_TEMP}/existing-${asset}"
              curl -fsS -L -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
                -H "Accept: application/octet-stream" "${existing_url}" -o "${existing_asset}"
              cmp -s "${apk_dir}/${asset}" "${existing_asset}" || { echo "::error::Existing ${asset} is not byte-identical; refusing published-release mutation"; exit 1; }
              continue
            fi

            content_type="text/plain"
            [[ "${asset}" == "jig-android.apk" ]] && content_type="application/vnd.android.package-archive"
            curl -fsS -H "${auth_header}" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: ${content_type}" --data-binary @"${apk_dir}/${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset}" >/dev/null
          done
